<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Industrial MCP Live AR</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    .overlay-top {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 9999;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      pointer-events: none;
    }
    .glass {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(56, 189, 248, 0.45);
      border-radius: 14px;
      color: #f8fafc;
      padding: 10px 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }
    .glass.alarm {
      border-color: rgba(244, 63, 94, 0.9);
      box-shadow: 0 0 22px rgba(244, 63, 94, 0.4);
    }
    .status-pill {
      font-size: 11px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 4px;
    }
    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      direction: ltr;
      min-width: 190px;
    }
    .metric-box {
      background: rgba(2, 6, 23, 0.65);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 8px;
      padding: 5px 8px;
    }
    .metric-label { font-size: 10px; color: #94a3b8; }
    .metric-val { font-size: 14px; font-weight: 700; color: #ffffff; }
    .badge-ok { color: #34d399; }
    .badge-err { color: #fb7185; }

    .overlay-bottom {
      position: fixed;
      bottom: 16px;
      left: 12px;
      right: 12px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .hitl-box {
      pointer-events: auto;
      display: none;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(251, 191, 36, 0.75);
      border-radius: 14px;
      padding: 12px;
      color: #f8fafc;
    }
    .hitl-box.show { display: block; }
    .btn-row {
      pointer-events: auto;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-danger { background: #e11d48; color: #ffffff; }
    .btn-dark { background: rgba(15, 23, 42, 0.88); color: #e2e8f0; border: 1px solid rgba(148, 163, 184, 0.35); }
    .btn-ok { background: #10b981; color: #022c22; flex: 1; }
    .btn-no { background: rgba(244, 63, 94, 0.2); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.5); flex: 1; }
    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(2, 6, 23, 0.82);
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-bg.show { display: flex; }
    .modal-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      max-width: 360px;
      color: #f8fafc;
    }
    .modal-card input {
      width: 100%;
      padding: 8px 10px;
      margin: 4px 0 10px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #020617;
      color: #ffffff;
      font-size: 12px;
      direction: ltr;
    }
    .modal-card label { font-size: 11px; color: #94a3b8; display: block; direction: ltr; }
  </style>
</head>
<body>

  <!-- Floating HUD Top -->
  <div class="overlay-top">
    <div id="hud-box" class="glass">
      <div id="ar-debug" class="status-pill">جاري تشغيل الكاميرا...</div>
      <div class="metrics">
        <div class="metric-box">
          <div class="metric-label">MOTOR RPM</div>
          <div id="val-rpm" class="metric-val">1420</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">TEMP °C</div>
          <div id="val-temp" class="metric-val">64.2</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">STATUS</div>
          <div id="val-status" class="metric-val badge-ok">RUNNING</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">SAFETY GATE</div>
          <div id="val-gate" class="metric-val badge-ok">ARMED</div>
        </div>
      </div>
    </div>

    <button id="btn-mqtt-modal" type="button" class="glass" style="font-size:12px;font-weight:700;">MQTT</button>
  </div>

  <!-- Floating Controls Bottom -->
  <div class="overlay-bottom">
    <div id="hitl-box" class="hitl-box">
      <div style="font-size:12px;font-weight:700;color:#fbbf24;margin-bottom:4px;">طلب موافقة بشرية (AI MCP Safety Gate)</div>
      <div id="hitl-msg" style="font-size:12px;color:#e2e8f0;margin-bottom:10px;line-height:1.5;">
        ارتفاع حرارة الملفات (92.4°C). يقترح الـ AI خفض السرعة إلى 1050 RPM.
      </div>
      <div class="btn-row">
        <button id="btn-approve" type="button" class="btn-ok">موافقة وتنفيذ (Approve)</button>
        <button id="btn-reject" type="button" class="btn-no">رفض (Reject)</button>
      </div>
    </div>

    <div class="btn-row">
      <button id="btn-fault" type="button" class="btn-danger">افتعل عطل حرارة + AI</button>
      <button id="btn-reset" type="button" class="btn-dark">وضع طبيعي</button>
    </div>
  </div>

  <!-- MQTT Settings Modal -->
  <div id="mqtt-modal" class="modal-bg">
    <div class="modal-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <strong style="font-size:14px;">إعدادات MQTT الحي</strong>
        <button id="btn-close-modal" type="button" class="btn-dark" style="padding:4px 10px;">✕</button>
      </div>
      <label>Broker WSS URL</label>
      <input id="inp-broker" type="text" value="wss://broker.emqx.io:8084/mqtt" />
      <label>Telemetry Topic</label>
      <input id="inp-tel" type="text" value="factory/line1/motor1/telemetry" />
      <label>AI Proposal Topic</label>
      <input id="inp-prop" type="text" value="factory/line1/motor1/ai_proposal" />
      <label>Approved Cmd Topic</label>
      <input id="inp-cmd" type="text" value="factory/line1/motor1/approved_cmd" />
      <div class="btn-row">
        <button id="btn-connect" type="button" class="btn-ok">اتصال MQTT</button>
        <button id="btn-disconnect" type="button" class="btn-dark">قطع</button>
      </div>
    </div>
  </div>

  <!-- Official MindAR + A-Frame Scene (Direct child of body for guaranteed camera visibility) -->
  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: ./targets.mind; uiScanning: yes; uiLoading: yes;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target-entity" mindar-image-target="targetIndex: 0">
      <a-plane position="0 0.35 0" width="1.15" height="0.6" color="#0f172a" opacity="0.9"></a-plane>
      <a-text value="MOTOR-01 • LIVE AR" position="0 0.54 0.02" align="center" color="#38bdf8" width="1.8"></a-text>
      <a-text id="ar-rpm" value="RPM: 1420" position="0 0.39 0.02" align="center" color="#ffffff" width="2.0"></a-text>
      <a-text id="ar-temp" value="TEMP: 64.2 C" position="0 0.25 0.02" align="center" color="#fbbf24" width="2.0"></a-text>
      <a-text id="ar-status" value="STATUS: RUNNING" position="0 0.12 0.02" align="center" color="#34d399" width="1.8"></a-text>
      <a-cone id="ar-arrow" visible="false" position="0.45 -0.15 0.1" rotation="0 0 180" radius-bottom="0.09" height="0.24" color="#f43f5e"></a-cone>
    </a-entity>
  </a-scene>

  <script>
    (function () {
      const state = {
        rpm: 1420,
        targetRpm: 1420,
        temp: 64.2,
        status: 'RUNNING',
        fault: false,
        proposal: null,
        client: null,
        connected: false
      };

      const elDebug = document.getElementById('ar-debug');
      const elHud = document.getElementById('hud-box');
      const elRpm = document.getElementById('val-rpm');
      const elTemp = document.getElementById('val-temp');
      const elStatus = document.getElementById('val-status');
      const elGate = document.getElementById('val-gate');
      const elHitl = document.getElementById('hitl-box');
      const elHitlMsg = document.getElementById('hitl-msg');

      const arRpm = document.getElementById('ar-rpm');
      const arTemp = document.getElementById('ar-temp');
      const arStatus = document.getElementById('ar-status');
      const arArrow = document.getElementById('ar-arrow');

      function render() {
        const isAlarm = state.status === 'ALARM' || state.temp >= 85;
        elRpm.textContent = Math.round(state.rpm);
        elTemp.textContent = state.temp.toFixed(1);
        elStatus.textContent = isAlarm ? 'OVERHEAT' : state.status;
        elStatus.className = isAlarm ? 'metric-val badge-err' : 'metric-val badge-ok';
        elHud.classList.toggle('alarm', isAlarm);

        if (arRpm) arRpm.setAttribute('value', `RPM: ${Math.round(state.rpm)}`);
        if (arTemp) arTemp.setAttribute('value', `TEMP: ${state.temp.toFixed(1)} C`);
        if (arStatus) {
          arStatus.setAttribute('value', isAlarm ? 'STATUS: OVERHEAT!' : 'STATUS: RUNNING');
          arStatus.setAttribute('color', isAlarm ? '#fb7185' : '#34d399');
        }
        if (arArrow) arArrow.setAttribute('visible', isAlarm ? 'true' : 'false');
      }

      // MindAR lifecycle status messages
      const scene = document.getElementById('ar-scene');
      const target = document.getElementById('target-entity');
      if (scene) {
        scene.addEventListener('arReady', () => {
          elDebug.textContent = 'الكاميرا شغالة • وجّهها للصورة';
          elDebug.style.color = '#34d399';
        });
        scene.addEventListener('arError', () => {
          elDebug.textContent = 'خطأ في الكاميرا أو ملف targets.mind';
          elDebug.style.color = '#fb7185';
        });
      }
      if (target) {
        target.addEventListener('targetFound', () => {
          elDebug.textContent = 'تم التقاط الهدف (Target Locked)';
          elDebug.style.color = '#38bdf8';
        });
        target.addEventListener('targetLost', () => {
          elDebug.textContent = 'ابحث عن صورة الهدف...';
          elDebug.style.color = '#fbbf24';
        });
      }

      // Local simulation tick when MQTT is not connected
      setInterval(() => {
        if (state.connected) return;
        state.rpm += (state.targetRpm - state.rpm) * 0.25 + (Math.random() - 0.5) * 5;
        const goalTemp = state.fault ? 92.6 : (state.targetRpm < 1200 ? 58.2 : 64.2);
        state.temp += (goalTemp - state.temp) * 0.2 + (Math.random() - 0.5) * 0.3;
        render();
      }, 700);

      function showProposal(prop) {
        const rpm = Number(prop.target_rpm);
        if (!Number.isFinite(rpm) || rpm < 600 || rpm > 1500) {
          elGate.textContent = 'BLOCKED';
          elGate.className = 'metric-val badge-err';
          return;
        }
        state.proposal = prop;
        elGate.textContent = 'PENDING';
        elGate.className = 'metric-val';
        elGate.style.color = '#fbbf24';
        elHitlMsg.textContent = prop.reason || `يقترح الـ AI تعديل السرعة إلى ${rpm} RPM.`;
        elHitl.classList.add('show');
      }

      function resolveProposal(ok) {
        if (!state.proposal) return;
        const prop = state.proposal;
        state.proposal = null;
        elHitl.classList.remove('show');
        elGate.textContent = 'ARMED';
        elGate.className = 'metric-val badge-ok';
        elGate.style.color = '';

        if (state.connected && state.client) {
          const cmdTopic = document.getElementById('inp-cmd').value.trim();
          state.client.publish(cmdTopic, JSON.stringify({ action: ok ? 'APPROVE' : 'REJECT', target_rpm: prop.target_rpm }));
        }
        if (ok) {
          state.targetRpm = Number(prop.target_rpm);
          state.fault = false;
          state.status = 'RUNNING';
        }
        render();
      }

      document.getElementById('btn-fault').addEventListener('click', () => {
        state.fault = true;
        state.status = 'ALARM';
        state.temp = 92.4;
        state.rpm = 1480;
        render();
        showProposal({
          target_rpm: 1050,
          reason: 'ارتفاع حرارة الملفات (92.4°C). يقترح الـ AI MCP خفض السرعة إلى 1050 RPM بأمان.'
        });
      });

      document.getElementById('btn-reset').addEventListener('click', () => {
        state.fault = false;
        state.status = 'RUNNING';
        state.targetRpm = 1420;
        state.temp = 64.2;
        state.proposal = null;
        elHitl.classList.remove('show');
        elGate.textContent = 'ARMED';
        elGate.className = 'metric-val badge-ok';
        render();
      });

      document.getElementById('btn-approve').addEventListener('click', () => resolveProposal(true));
      document.getElementById('btn-reject').addEventListener('click', () => resolveProposal(false));

      const modal = document.getElementById('mqtt-modal');
      document.getElementById('btn-mqtt-modal').addEventListener('click', () => modal.classList.add('show'));
      document.getElementById('btn-close-modal').addEventListener('click', () => modal.classList.remove('show'));

      document.getElementById('btn-connect').addEventListener('click', () => {
        const url = document.getElementById('inp-broker').value.trim();
        const tel = document.getElementById('inp-tel').value.trim();
        const prop = document.getElementById('inp-prop').value.trim();
        if (!url.startsWith('wss://') || typeof window.mqtt === 'undefined') return;
        try {
          if (state.client) state.client.end(true);
          const c = window.mqtt.connect(url, { connectTimeout: 5000, reconnectPeriod: 0 });
          state.client = c;
          c.on('connect', () => {
            state.connected = true;
            c.subscribe([tel, prop]);
            elDebug.textContent = 'متصل بـ MQTT Live';
            modal.classList.remove('show');
          });
          c.on('message', (topic, msg) => {
            try {
              const d = JSON.parse(msg.toString());
              if (topic === tel) {
                if (typeof d.rpm === 'number') state.rpm = d.rpm;
                if (typeof d.temp === 'number') state.temp = d.temp;
                if (d.status) state.status = d.status;
                render();
              } else if (topic === prop) {
                showProposal(d);
              }
            } catch (e) {}
          });
        } catch (e) {}
      });

      document.getElementById('btn-disconnect').addEventListener('click', () => {
        if (state.client) state.client.end(true);
        state.client = null;
        state.connected = false;
        modal.classList.remove('show');
      });

      render();
    })();
  </script>
</body>
</html>
